name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: nandha-notes
  INSTANCE_ID: i-0628d42586ea94f9e
  SERVER_NAME: nandha-notes-server
  SECRET_ID: deptic/nandha-notes/secrets
  PUBLIC_IP: 3.7.135.174
  PUBLIC_URL: http://3.7.135.174
  CONTAINER_PORT: 5000
  DOCKERFILE_PATH: .

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (build diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build diagnostics (npm install + syntax check)
        run: |
          set -e
          node --version
          npm --version
          npm install --omit=dev --no-audit --no-fund
          node --check server.js
          test -f server.js && test -f package.json && test -f Dockerfile
          echo "Build diagnostics passed: server.js syntax OK, dependencies installed."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (direct AWS CLI, static credentials)
        id: login-ecr
        run: |
          set -e
          REGION="${AWS_REGION:-ap-south-1}"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com
          echo "registry=759204735992.dkr.ecr.ap-south-1.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          REGION="${AWS_REGION:-ap-south-1}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE from context: $DOCKERFILE_PATH"
          docker build --file Dockerfile --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" "$DOCKERFILE_PATH"
          echo "--- image inspect diagnostics ---"
          docker images "$FULL_IMAGE"
          docker inspect "$FULL_IMAGE:latest" --format 'ExposedPorts={{.Config.ExposedPorts}} Cmd={{.Config.Cmd}}'
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM RunShellScript
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          REGION="${AWS_REGION:-ap-south-1}"
          INSTANCE_ID="$INSTANCE_ID"
          ECR_REGISTRY="${ECR_REGISTRY:-759204735992.dkr.ecr.ap-south-1.amazonaws.com}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          # Dynamic resolution: if INSTANCE_ID missing/stopped, locate active instance by tag
          if [ -z "$INSTANCE_ID" ] || ! aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null | grep -q "running"; then
            echo "==> Resolving active EC2 instance by tag Name=$SERVER_NAME..."
            RESOLVED_ID=$(aws ec2 describe-instances --region "$REGION" \
              --filters "Name=tag:Name,Values=$SERVER_NAME" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              INSTANCE_ID="$RESOLVED_ID"
              echo "==> Resolved instance: $INSTANCE_ID"
            else
              echo "ERROR: no running EC2 instance found for INSTANCE_ID or tag Name=$SERVER_NAME" >&2
              exit 1
            fi
          fi
          echo "Deploying to instance $INSTANCE_ID"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/nandha-notes:latest",
              "docker stop app || true",
              "docker rm app || true",
              "ENV_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/nandha-notes/secrets --region ap-south-1 --query SecretString --output text)",
              "echo \"$ENV_JSON\" > /tmp/app.env.json",
              "docker run -d --restart always --name app -p 80:5000 --env-file /tmp/app.env.json 759204735992.dkr.ecr.ap-south-1.amazonaws.com/nandha-notes:latest",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "CommandId=$COMMAND_ID"

          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "StandardErrorContent" --output text || true
              exit 1
            fi
            sleep 5
          done
          if [ "$STATUS" != "Success" ]; then echo "SSM command did not succeed in time" >&2; exit 1; fi
          echo "SSM deploy command succeeded on $INSTANCE_ID"

      - name: Verify deployment (health check, must be HTTP 200)
        run: |
          set -e
          URL="http://3.7.135.174"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 10
          done
          if [ "$CODE" != "200" ]; then
            echo "Health check failed; last response body:" >&2
            cat /tmp/health-body >&2 || true
            exit 1
          fi
          echo "Health check passed with HTTP 200 at $URL"

      - name: Summary outputs
        run: |
          {
            echo "public_ip=3.7.135.174"
            echo "public_url=http://3.7.135.174"
            echo "alb_dns_name=3.7.135.174"
            echo "instance_id=i-0628d42586ea94f9e"
            echo "ecr_repo_url=759204735992.dkr.ecr.ap-south-1.amazonaws.com/nandha-notes"
            echo "security_group_id=sg-046990a650115c861"
            echo "iam_instance_profile=nandha-notes-instance-profile"
            echo "iam_role=nandha-notes-ec2-role"
          } >> "$GITHUB_OUTPUT"
        id: summary