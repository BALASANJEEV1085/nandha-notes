<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" mov="viewport" content="width=device-width, initial-scale=1.0">
    <title>NANDHA NOTES - Home</title>
    <link rel="icon" href="logo1.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUa5YdNCe++2t4e5jq3JtkzYUdppCmzp34gV1lY7yY2g5ypYcKqHTa9TTVFW" crossorigin="anonymous">
    <style>
        body{background:#f8f9fa;}
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">NANDHA NOTES</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Signup</h5>
                    <form id="signupForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                    </form>
                    <div id="signupMsg" class="mt-3"></div>
                </div>
            </div>
            <div class="card shadow-sm mt-3">
                <div class="card-body">
                    <h5 class="card-title">Login</h5>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Login</button>
                    </form>
                    <div id="loginMsg" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ACg/w3uD2NfnavRjKZSDJy8mBvB0VovedBkLkiwjnuhqjWf36uY8qRwxHCNs3SAg" crossorigin="anonymous"></script>
<script>
async function post(url, data){
  const res = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  return res.json();
}

document.getElementById('signupForm').addEventListener('submit', async (e)=>{e.preventDefault();const form=document.getElementById('signupForm');const data={username:form.username.value,email:form.email.value,password:form.password.value};const resp=await post('/signup',data);document.getElementById('signupMsg').innerText=resp.message||resp.error;});

document.getElementById('loginForm').addEventListener('submit', async (e)=>{e.preventDefault();const form=document.getElementById('loginForm');const data={email:form.email.value,password:form.password.value};const resp=await post('/login',data);document.getElementById('loginMsg').innerText=resp.message||resp.error;});
</script>
</body>
</html>
